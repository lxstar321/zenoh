version: '3.8'

services:
  # TLS版本：3个Router组成的网关集群
  gateway-router-1:
    image: eclipse/zenoh:latest
    container_name: gateway-router-1
    ports:
      - "7447:7447"  # TLS端口
      - "8001:8000"  # Admin端口
    volumes:
      - ./tls-certs:/app/certs:ro
      - .:/app/zenoh
    command: >
      -c /app/zenoh/tls-router-config.json5
    networks:
      zenoh-network:
        ipv4_address: 172.30.0.10
    # 暂时移除健康检查，让容器能够启动
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8000/@/router/*/status"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3

  gateway-router-2:
    image: eclipse/zenoh:latest
    container_name: gateway-router-2
    ports:
      - "7448:7447"
      - "8002:8000"
    volumes:
      - ./tls-certs:/app/certs:ro
      - .:/app/zenoh
    command: >
      -c /app/zenoh/tls-router-2-config.json5
    networks:
      zenoh-network:
        ipv4_address: 172.30.0.11
    depends_on:
      gateway-router-1:
        condition: service_started

  gateway-router-3:
    image: eclipse/zenoh:latest
    container_name: gateway-router-3
    ports:
      - "7449:7447"
      - "8003:8000"
    volumes:
      - ./tls-certs:/app/certs:ro
      - .:/app/zenoh
    command: >
      -c /app/zenoh/tls-router-3-config.json5
    networks:
      zenoh-network:
        ipv4_address: 172.30.0.12
    depends_on:
      gateway-router-2:
        condition: service_started

  # TLS版本：租户A的数据Agent (使用Zenoh Python SDK)
  tenant-a-agent:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: tenant-a-agent
    volumes:
      - ./tls-certs:/app/certs:ro
      - .:/app/zenoh    
    environment:
      - TENANT_ID=tenant-a
      - PROCESS_INTERVAL=8
    command: >
      python3 /app/zenoh/data_processor.py
    networks:
      zenoh-network:
        ipv4_address: 172.30.0.20
    depends_on:
      - gateway-router-1
      - gateway-router-2
      - gateway-router-3

  # TLS版本：全局数据收集器 (使用Zenoh Python SDK)
  data-collector:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: data-collector
    volumes:
      - ./tls-certs:/app/certs:ro
      - .:/app/zenoh      
    environment:
      - COLLECT_INTERVAL=20
    command: >
      python3 /app/zenoh/data_collector.py
    networks:
      zenoh-network:
        ipv4_address: 172.30.0.21
    depends_on:
      - gateway-router-1
      - gateway-router-2
      - gateway-router-3

  # TLS版本：租户A的外部设备 (使用Zenoh Python SDK)
  tenant-a-device:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: tenant-a-device
    volumes:
      - ./tls-certs:/app/certs:ro
      - .:/app/zenoh
    environment:
      - TENANT_ID=tenant-a
      - DEVICE_ID=sensor-a-001
      - PUBLISH_INTERVAL=3
    command: >
      python3 /app/zenoh/data_generator.py
    networks:
      zenoh-network:
        ipv4_address: 172.30.0.100
    depends_on:
      - gateway-router-1
      - gateway-router-2
      - gateway-router-3

  # TLS版本：租户B的数据Agent (使用Zenoh Python SDK)
  tenant-b-agent:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: tenant-b-agent
    volumes:
      - ./tls-certs:/app/certs:ro
      - .:/app/zenoh      
    environment:
      - TENANT_ID=tenant-b
      - PROCESS_INTERVAL=12
    command: >
      python3 /app/zenoh/data_processor.py
    networks:
      zenoh-network:
        ipv4_address: 172.30.0.30
    depends_on:
      - gateway-router-1
      - gateway-router-2
      - gateway-router-3

  # TLS版本：租户B的外部设备 (使用Zenoh Python SDK)
  tenant-b-device:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: tenant-b-device
    volumes:
      - ./tls-certs:/app/certs:ro
      - .:/app/zenoh      
    environment:
      - TENANT_ID=tenant-b
      - DEVICE_ID=sensor-b-001
      - PUBLISH_INTERVAL=4
    command: >
      python3 /app/zenoh/data_generator.py
    networks:
      zenoh-network:
        ipv4_address: 172.30.0.101
    depends_on:
      - gateway-router-1
      - gateway-router-2
      - gateway-router-3

networks:
  zenoh-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1
